<div class="navbar bg-base-300 shadow-sm">
  <div class="navbar-start">
    <div class="dropdown">
      <div role="button" class="btn btn-ghost lg:hidden">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"> <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h8m-8 6h16" /> </svg>
      </div>
      <ul class="menu menu-sm dropdown-content bg-base-300 rounded-box z-1 mt-3 w-52 p-2 shadow">
        <li><a routerLink="/history">History</a></li>
        <li><a routerLink="/my-cv">My CV</a></li>
        <li><a routerLink="/about">About</a></li>
      </ul>
    </div>
    <a class="btn btn-ghost" routerLink="/">
      <img src="assets/images/logo.png" alt="Your App Logo" class="h-10">
    </a>
  </div>
  <div class="navbar-center hidden lg:flex">
    <ul class="menu menu-horizontal px-1">
      <li><a routerLink="/history">History</a></li>
      <li><a routerLink="/my-cv">My CV</a></li>
      <li><a routerLink="/about">About</a></li>
    </ul>
  </div>
  <div class="navbar-end">
    <label class="flex cursor-pointer gap-2 pe-5">
      <fa-icon [icon]="['fas', 'sun']"></fa-icon>
      <input type="checkbox" class="toggle theme-controller" (change)="toggleTheme($event)" />
      <fa-icon [icon]="['fas', 'moon']"></fa-icon>
    </label>
    <div class="dropdown dropdown-end pe-4">
      <div role="button" tabindex="0">
        @if (connectedUser && connectedUser.imageUrl) {
          <div class="avatar">
            <div class="mask mask-squircle w-10">
              <img src="{{connectedUser.imageUrl}}" alt="user-avatar"/>
            </div>
          </div>
        } @else {
          <fa-icon [icon]="['fas', 'user']" class="menu-icon"></fa-icon>
        }
      </div>
      @if (connectedUser) {
        <ul class="menu menu-sm dropdown-content bg-base-300 rounded-box z-1 mt-3 w-52 p-2 shadow">
          <li>
            <button class="link" (click)="editProfile()">Edit profile</button>
          </li>
          <li>
            <button class="link" (click)="logout()">Logout</button>
          </li>
        </ul>
      } @else {
        <ul class="menu menu-sm dropdown-content bg-base-300 rounded-box z-1 mt-3 w-52 p-2 shadow">
          <li>
            <button class="link" (click)="login()">Login</button>
          </li>
        </ul>
      }
    </div>
  </div>
</div>
